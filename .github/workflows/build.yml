name: Android Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        gradle-version: '9.5.1'
        # ⚠️ TEMPORÁRIO: build vinha travando com "duplicate class:
        # com.vltv.play.SeriesStream" mesmo depois de apagar os caches
        # manualmente pela aba Actions > Caches do GitHub. O código-fonte
        # foi conferido (inclusive pela busca de código do próprio
        # GitHub) e NÃO tem nenhuma classe duplicada — então o problema
        # só pode ser algum estado de cache/incremental que essa action
        # ainda estava restaurando sozinha. "cache-disabled: true" faz
        # essa action não salvar nem restaurar cache nenhum (nem
        # dependências, nem cache de build), garantindo uma build 100%
        # do zero. Depois que confirmar que voltou a funcionar, pode
        # remover essa linha pra build voltar a ficar mais rápida — se
        # o erro não voltar, foi isso mesmo.
        cache-disabled: true

    # ✅ ATUALIZADO: agora recria a keystore de RELEASE (release.keystore)
    # a partir do Secret RELEASE_KEYSTORE_BASE64, em vez da de debug.
    # Nunca fica commitada no repositório — só existe durante esta
    # execução do build, dentro do runner do Actions.
    - name: Recriar release.keystore a partir do Secret
      run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release.keystore

    # ✅ NOVO: recria a debug.keystore a partir do Secret DEBUG_KEYSTORE_BASE64
    # (mesmo esquema da de release, acima). Hoje nenhuma etapa deste workflow
    # gera um build de debug (assembleDebug) — o build de release não depende
    # dela —, mas ela fica pronta aqui caso um dia você queira reativar um
    # passo de "gradle assembleDebug" sem precisar recriar o Secret de novo.
    - name: Recriar debug.keystore a partir do Secret
      run: echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > debug.keystore

    # ✅ CORRIGIDO: adicionado "clean" antes do "assembleRelease".
    # O cache do Gradle (dependências) continua sendo reaproveitado
    # normalmente — isso só apaga os arquivos INTERMEDIÁRIOS do seu
    # projeto (pasta app/build/), incluindo o R.java gerado a partir
    # dos recursos (layouts, strings, drawables). Sem isso, quando um
    # layout novo era adicionado, às vezes o build reaproveitava um
    # R.java antigo (de antes do arquivo existir), causando erros como
    # "Resources$NotFoundException: Resource ID #0x..." em tempo de
    # execução, mesmo com o arquivo certinho no repositório.
    - name: Build with Gradle
      env:
        RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      run: gradle clean assembleRelease --no-build-cache --rerun-tasks --stacktrace

    # 🔎 DIAGNÓSTICO TEMPORÁRIO — só roda se o passo acima falhar.
    # Vasculha TODO o projeto (não só o esperado) atrás de qualquer
    # arquivo chamado "SeriesStream" (fonte .kt ou stub .java gerado),
    # mostrando caminho completo, data/hora de modificação e o conteúdo
    # de cada um. Isso mostra, com prova, onde está o segundo arquivo
    # que está colidindo com com.vltv.play.SeriesStream — mesmo que ele
    # não apareça na busca de código do site do GitHub (por exemplo, se
    # for gerado em tempo de build, ou vier de algum outro diretório).
    - name: "🔎 Diagnóstico: localizar todo arquivo SeriesStream"
      if: failure()
      run: |
        echo "===== Buscando qualquer arquivo chamado SeriesStream em todo o projeto ====="
        find . -iname "*SeriesStream*" -not -path "*/.git/*" -print 2>/dev/null | while read -r f; do
          echo ""
          echo "----- ARQUIVO: $f -----"
          ls -la "$f"
          echo "--- conteúdo ---"
          cat "$f"
          echo "--- fim do conteúdo ---"
        done
        echo ""
        echo "===== Todos os .java stub gerados pelo kapt sob esse nome ====="
        find app/build/tmp/kapt3 -iname "SeriesStream*.java" -print 2>/dev/null
        echo ""
        echo "===== Todo arquivo-fonte .kt que contém a palavra SeriesStream ====="
        grep -rl "SeriesStream" --include="*.kt" app/src 2>/dev/null

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/apk/release/VLTV-Play.apk

    # ✅ NOVO: guarda o mapping.txt (dicionário nome-embaralhado -> nome
    # original) de cada build. Sem isso, um stack trace de crash em
    # produção (como o "s20.s(...)") é ilegível — com ele, dá pra
    # decodificar exatamente qual classe/método/linha originais
    # causaram o erro. Baixe o artefato "mapping" do mesmo build que
    # gerou o VLTV-Play.apk que você instalou, sempre que for
    # investigar um crash.
    - name: Upload mapping.txt
      uses: actions/upload-artifact@v4
      with:
        name: mapping
        path: app/build/outputs/mapping/release/mapping.txt
