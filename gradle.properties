# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.builtInKotlin=false
android.newDsl=false
# ✅ REMOVIDO: kapt.use.k2=false
# Essa flag forçava o kapt a rodar no frontend K1 do compilador Kotlin.
# No Kotlin 2.3.20 o K1 já está sendo descontinuado/removido, e o kapt
# rodando em K1 nessa versão entrava num modo instável — foi isso que
# causava "Running non-incrementally because analyzing file [...] failed"
# seguido de "duplicate class: com.vltv.play.SeriesStream" no log do
# Actions. Sem essa flag, o kapt usa K2 (o modo padrão e suportado),
# que processa os stubs corretamente. Isso não tem relação com Room
# nem com a migração pra KSP — SeriesStream nem é uma @Entity do Room,
# é só um DTO do Retrofit (XtreamApi.kt); o kapt sempre stubou ele
# porque stuba TODAS as classes Kotlin do módulo, não só as anotadas.
